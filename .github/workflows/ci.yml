# Tests on every push and pull request. Free on public repositories.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web app (unit tests, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  hubspot-card:
    name: HubSpot card (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hubspot/src/app/cards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit -p .

  schema:
    name: Database (migrations + behaviour tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh
